plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arjun.signagekiosktest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arjun.signagekiosktest'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0-launcher-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

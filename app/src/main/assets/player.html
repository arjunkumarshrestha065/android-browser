<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial}#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}video,img{width:100%;height:100%;object-fit:contain;background:#000}#msg{font-size:28px;text-align:center;padding:30px}.small{font-size:16px;color:#aaa;margin-top:12px}
</style></head><body><div id="stage"><div id="msg">Loading saved playlist...</div></div><script>
let items=[],index=0,timer=null;
function bridgePlaylist(){try{return JSON.parse(AndroidSignage.getPlaylist()||'{"items":[]}')}catch(e){return {items:[]}}}
function mediaUrl(uri){try{return AndroidSignage.mediaUrl(uri)}catch(e){return uri}}
function start(){const p=bridgePlaylist();items=p.items||[];if(!items.length){document.getElementById('stage').innerHTML='<div id="msg">No downloaded media available<div class="small">Connect internet and press Sync in setup.</div></div>';setTimeout(()=>{try{AndroidSignage.requestSync()}catch(e){}},15000);return}index=0;play()}
function next(){if(timer)clearTimeout(timer);index=(index+1)%items.length;play()}
function play(){const x=items[index],stage=document.getElementById('stage');stage.innerHTML='';const url=mediaUrl(x.uri);if(x.type==='image'){const img=document.createElement('img');img.src=url;img.onerror=next;stage.appendChild(img);timer=setTimeout(next,Math.max(1,Number(x.duration||10))*1000)}else{const v=document.createElement('video');v.src=url;v.autoplay=true;v.muted=false;v.playsInline=true;v.onended=next;v.onerror=next;stage.appendChild(v);v.play().catch(()=>{v.muted=true;v.play().catch(next)})}}
window.addEventListener('load',start);
</script></body></html>
